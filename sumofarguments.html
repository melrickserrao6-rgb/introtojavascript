<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        var value = Math.abs(10);
        document.write("Absolute Number  :" + value + "<br>");
        var value = Math.acos(-1);
        document.write("Arc Cosine :" + value + "<br>");
        var value = Math.asin(1);
        document.write("ArcSine :" + value + "<br>");
        var value = Math.atan(.5);
        document.write("Arc Tangent :" + value + "<br>");
        var value = Math.floor(4.5);
        document.write("Round to nearest lower value :" + value + "<br>");
        var value = Math.ceil(4.5);
        document.write("Round to nearest higher value :" + value + "<br>");
    </script>
</body>
</html>
